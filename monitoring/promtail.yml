server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: tour_nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_access
          service: booking_proxy
          __path__: /var/log/nginx/access.log
  - job_name: tour_nginx_errors
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_error
          service: booking_proxy
          __path__: /var/log/nginx/error.log
